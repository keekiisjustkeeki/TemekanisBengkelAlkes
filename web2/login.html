<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TeMekanis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link rel="icon" href="LOGO TMEKANIS.png" type="image/png">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
        }
        .login-header {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }
        .login-body {
            padding: 40px;
        }
        .form-control {
            border-radius: 12px;
            padding: 14px;
            border: 2px solid #e2e8f0;
        }
        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99,102,241,0.1);
        }
        .btn-login {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
        }
        .toggle-password {
            cursor: pointer;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
        }
        .password-group {
            position: relative;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <img src="LOGO TMEKANIS.png" alt="Logo" style="height: 60px; border-radius: 10px;">
            <h4 class="mt-3 mb-1">TeMekanis Bengkel Alkes</h4>
            <p class="mb-0 small">Silakan masuk untuk melanjutkan</p>
        </div>
        <div class="login-body">
            <div id="alert-message"></div>
            
            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label fw-bold">Username atau Email</label>
                    <input type="text" class="form-control" id="login-identifier" placeholder="Masukkan username atau email" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Password</label>
                    <div class="password-group">
                        <input type="password" class="form-control" id="login-password" placeholder="Masukkan password" required>
                        <i class="bi bi-eye-slash toggle-password" id="toggle-password"></i>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Masuk sebagai</label>
                    <select class="form-select" id="login-role">
                        <option value="pelanggan">Pelanggan</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-primary btn-login w-100 text-white">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Masuk
                </button>
            </form>
            
            <hr class="my-4">
            
            <p class="text-center mb-0">
                Belum punya akun? 
                <a href="#" onclick="showRegister()" class="text-decoration-none fw-bold">Daftar sekarang</a>
            </p>
            
            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Kembali ke Beranda
                </a>
            </div>
        </div>
    </div>

    <!-- Modal Daftar -->
    <div class="modal fade" id="registerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Daftar Akun Baru</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="register-form">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Username</label>
                            <input type="text" class="form-control" id="reg-username" placeholder="Masukkan username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email</label>
                            <input type="email" class="form-control" id="reg-email" placeholder="Masukkan email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nomor Telepon</label>
                            <input type="tel" class="form-control" id="reg-phone" placeholder="Masukkan nomor telepon" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Password</label>
                            <input type="password" class="form-control" id="reg-password" placeholder="Masukkan password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Daftar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Toggle password visibility
        document.getElementById('toggle-password').addEventListener('click', function() {
            const passwordInput = document.getElementById('login-password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                this.classList.remove('bi-eye-slash');
                this.classList.add('bi-eye');
            } else {
                passwordInput.type = 'password';
                this.classList.remove('bi-eye');
                this.classList.add('bi-eye-slash');
            }
        });

        // Show register modal
        function showRegister() {
            new bootstrap.Modal(document.getElementById('registerModal')).show();
        }

        // Login form submission
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const identifier = document.getElementById('login-identifier').value;
            const password = document.getElementById('login-password').value;
            const role = document.getElementById('login-role').value;
            
            const result = authLogin(identifier, password, role);
            
            if (result.success) {
                // Store session
                localStorage.setItem('currentUser', JSON.stringify(result.user));
                localStorage.setItem('userRole', result.user.role);
                
                // Show success
                document.getElementById('alert-message').innerHTML = 
                    '<div class="alert alert-success"><i class="bi bi-check-circle me-2"></i>Login berhasil! Mengalihkan...</div>';
                
                setTimeout(() => {
                    if (result.user.role === 'admin') {
                        window.location.href = 'admin/dashboard.html';
                    } else {
                        window.location.href = 'pelanggan/beranda.html';
                    }
                }, 1000);
            } else {
                document.getElementById('alert-message').innerHTML = 
                    '<div class="alert alert-danger"><i class="bi bi-exclamation-circle me-2"></i>' + result.message + '</div>';
            }
        });

        // Register form submission
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userData = {
                username: document.getElementById('reg-username').value,
                email: document.getElementById('reg-email').value,
                phone: document.getElementById('reg-phone').value,
                password: document.getElementById('reg-password').value,
                role: 'pelanggan'
            };
            
            const result = authRegister(userData);
            
            if (result.success) {
                document.getElementById('alert-message').innerHTML = 
                    '<div class="alert alert-success"><i class="bi bi-check-circle me-2"></i>Registrasi berhasil! Silakan login.</div>';
                bootstrap.Modal.getInstance(document.getElementById('registerModal')).hide();
                document.getElementById('register-form').reset();
            } else {
                document.getElementById('alert-message').innerHTML = 
                    '<div class="alert alert-danger"><i class="bi bi-exclamation-circle me-2"></i>' + result.message + '</div>';
            }
        });
    </script>
</body>
</html>
