<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Saya - TeMekanis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link rel="icon" href="../LOGO TMEKANIS.png" type="image/png">
    <style>
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(180deg, #6366f1 0%, #8b5cf6 100%);
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.9);
            padding: 12px 20px;
            border-radius: 8px;
            margin: 4px 0;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background: rgba(255,255,255,0.2);
            color: white;
        }
    </style>
</head>
<body>

<div class="container-fluid">
<div class="row">

<!-- SIDEBAR -->
<nav class="col-md-3 col-lg-2 d-md-block sidebar collapse show" id="sidebar">
<div class="position-sticky pt-3">

<div class="text-center mb-4">
<img src="../LOGO TMEKANIS.png" alt="Logo" style="height: 50px; border-radius: 10px;">
<h6 class="text-white mt-2">Pelanggan</h6>
</div>

<ul class="nav flex-column">

<li class="nav-item">
<a class="nav-link" href="beranda.html">
<i class="bi bi-house me-2"></i>Beranda
</a>
</li>

<li class="nav-item">
<a class="nav-link" href="chat.html">
<i class="bi bi-chat me-2"></i>Chat
</a>
</li>

<li class="nav-item">
<a class="nav-link active" href="surat.html">
<i class="bi bi-file-earmark-text me-2"></i>Surat Saya
</a>
</li>

<li class="nav-item">
<a class="nav-link active" href="profil.html">
<i class="bi bi-person me-2"></i>Profil Saya
</a>
</li>


<li class="nav-item mt-3">
<a class="nav-link" href="#" onclick="logout()">
<i class="bi bi-box-arrow-right me-2"></i>Keluar
</a>
</li>

</ul>
</div>
</nav>

<!-- MAIN CONTENT -->
<main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">

<div class="d-flex justify-content-between align-items-center mb-4">
<h4 class="fw-bold" id="page-title">Profil Saya</h4>

<div class="d-flex align-items-center">
<span class="me-3">Halo, <strong id="user-name"></strong></span>
<button class="btn btn-outline-danger btn-sm" onclick="logout()">
<i class="bi bi-box-arrow-right"></i>
</button>
</div>
</div>

<div id="alert-container"></div>

<!-- PROFIL CONTENT -->
<div class="row">
<div class="col-md-6 mb-4">
<div class="card">
<div class="card-header">
<h5 class="mb-0"><i class="bi bi-person me-2"></i>Informasi Profil</h5>
</div>
<div class="card-body">
<form id="profile-form">
<div class="mb-3">
<label class="form-label">Username</label>
<input type="text" class="form-control" id="profile-username" readonly>
</div>
<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" class="form-control" id="profile-email">
</div>
<div class="mb-3">
<label class="form-label">Nomor Telepon</label>
<input type="tel" class="form-control" id="profile-phone">
</div>
<button type="submit" class="btn btn-primary">
<i class="bi bi-save me-2"></i>Simpan Perubahan
</button>
</form>
</div>
</div>
</div>

<div class="col-md-6 mb-4">
<div class="card">
<div class="card-header">
<h5 class="mb-0"><i class="bi bi-key me-2"></i>Ubah Password</h5>
</div>
<div class="card-body">
<form id="password-form">
<div class="mb-3">
<label class="form-label">Password Lama</label>
<input type="password" class="form-control" id="old-password">
</div>
<div class="mb-3">
<label class="form-label">Password Baru</label>
<input type="password" class="form-control" id="new-password">
</div>
<div class="mb-3">
<label class="form-label">Konfirmasi Password Baru</label>
<input type="password" class="form-control" id="confirm-password">
</div>
<button type="submit" class="btn btn-warning">
<i class="bi bi-key-fill me-2"></i>Ubah Password
</button>
</form>
</div>
</div>
</div>
</div>

</main>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/pelanggan/pelanggan.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const user = getCurrentUser();
    if (!user || user.role !== 'pelanggan') {
        window.location.href = '../login.html';
        return;
    }
    document.getElementById('user-name').textContent = user.username;
    loadProfile();
});
</script>

</body>
</html>
