<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surat Saya - TeMekanis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link rel="icon" href="../LOGO TMEKANIS.png" type="image/png">
    <style>
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(180deg, #6366f1 0%, #8b5cf6 100%);
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.9);
            padding: 12px 20px;
            border-radius: 8px;
            margin: 4px 0;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background: rgba(255,255,255,0.2);
            color: white;
        }
    </style>
</head>
<body>

<div class="container-fluid">
<div class="row">

<!-- SIDEBAR -->
<nav class="col-md-3 col-lg-2 d-md-block sidebar collapse show" id="sidebar">
<div class="position-sticky pt-3">

<div class="text-center mb-4">
<img src="../LOGO TMEKANIS.png" alt="Logo" style="height: 50px; border-radius: 10px;">
<h6 class="text-white mt-2">Pelanggan</h6>
</div>

<ul class="nav flex-column">

<li class="nav-item">
<a class="nav-link" href="beranda.html">
<i class="bi bi-house me-2"></i>Beranda
</a>
</li>

<li class="nav-item">
<a class="nav-link" href="chat.html">
<i class="bi bi-chat me-2"></i>Chat
</a>
</li>

<li class="nav-item">
<a class="nav-link active" href="surat.html">
<i class="bi bi-file-earmark-text me-2"></i>Surat Saya
</a>
</li>

<li class="nav-item">
<a class="nav-link" href="profil.html">
<i class="bi bi-person me-2"></i>Profil Saya
</a>
</li>

<li class="nav-item mt-3">
<a class="nav-link" href="#" onclick="logout()">
<i class="bi bi-box-arrow-right me-2"></i>Keluar
</a>
</li>

</ul>
</div>
</nav>

<!-- MAIN CONTENT -->
<main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">

<div class="d-flex justify-content-between align-items-center mb-4">
<h4 class="fw-bold" id="page-title">Surat Saya</h4>

<div class="d-flex align-items-center">
<span class="me-3">Halo, <strong id="user-name"></strong></span>
<button class="btn btn-outline-danger btn-sm" onclick="logout()">
<i class="bi bi-box-arrow-right"></i>
</button>
</div>
</div>

<div id="alert-container"></div>

<!-- FILTER -->
<div class="card mb-3">
<div class="card-body">
<div class="row">
<div class="col-md-3">
<select class="form-select" id="filter-jenis" onchange="loadSurats()">
<option value="">Semua Jenis</option>
<option value="RAB">RAB</option>
<option value="INVOICE">Invoice</option>
</select>
</div>
<div class="col-md-3">
<input type="text" class="form-control" placeholder="Cari..." id="search-surat" onkeyup="loadSurats()">
</div>
</div>
</div>

<!-- SURAT LIST -->
<div class="card">
<div class="card-body">
<div class="table-responsive">
<table class="table table-hover" id="surat-table">
<thead>
<tr>
<th>No</th>
<th>Nomor</th>
<th>Jenis</th>
<th>Tanggal</th>
<th>Total</th>
<th>Aksi</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>
</div>
</div>

</main>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/surat/surat.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const user = getCurrentUser();
    if (!user || user.role !== 'pelanggan') {
        window.location.href = '../login.html';
        return;
    }
    document.getElementById('user-name').textContent = user.username;
    loadSurats();
});

function loadSurats() {
    const user = getCurrentUser();
    const allSurats = getAllSurats();
    
    // Filter by current user (by name since pelanggan_id might be null)
    let surats = allSurats.filter(s => s.nama_pelanggan.toLowerCase() === user.username.toLowerCase());
    
    const filterJenis = document.getElementById('filter-jenis').value;
    const search = document.getElementById('search-surat').value.toLowerCase();
    
    if (filterJenis) {
        surats = surats.filter(s => s.jenis === filterJenis);
    }
    
    if (search) {
        surats = surats.filter(s => 
            s.nomor.toLowerCase().includes(search)
        );
    }
    
    // Sort by date (newest first)
    surats.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    
    const tbody = document.querySelector('#surat-table tbody');
    
    if (surats.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center">Belum ada surat</td></tr>';
        return;
    }
    
    tbody.innerHTML = surats.map((surat, index) => {
        const items = JSON.parse(surat.items || '[]');
        let total = 0;
        items.forEach(item => {
            total += item.jumlah * item.harga;
        });
        
        const tanggal = new Date(surat.created_at).toLocaleDateString('id-ID');
        
        return `
            <tr>
                <td>${index + 1}</td>
                <td><strong>${surat.nomor}</strong></td>
                <td><span class="badge bg-${surat.jenis === 'RAB' ? 'warning' : 'primary'}">${surat.jenis}</span></td>
                <td>${tanggal}</td>
                <td>${formatRupiah(total)}</td>
                <td>
                    <button class="btn btn-sm btn-primary" onclick="viewSurat('${surat.id}')" title="Lihat">
                        <i class="bi bi-eye"></i>
                    </button>
                    <button class="btn btn-sm btn-success" onclick="downloadSuratPDF('${surat.id}')" title="Download PDF">
                        <i class="bi bi-file-earmark-pdf"></i>
                    </button>
                    <button class="btn btn-sm btn-secondary" onclick="printSurat('${surat.id}')" title="Cetak">
                        <i class="bi bi-printer"></i>
                    </button>
                </td>
            </tr>
        `;
    }).join('');
}

function viewSurat(suratId) {
    printSurat(suratId);
}

function showAlert(message, type) {
    document.getElementById('alert-container').innerHTML = 
        `<div class="alert alert-${type} alert-dismissible fade show">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>`;
    setTimeout(() => {
        document.getElementById('alert-container').innerHTML = '';
    }, 5000);
}

function logout() {
    localStorage.removeItem('currentUser');
    window.location.href = '../login.html';
}
</script>

</body>
</html>
