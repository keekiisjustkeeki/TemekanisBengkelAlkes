<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Kontak - Admin TeMekanis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link rel="icon" href="../LOGO TMEKANIS.png" type="image/png">
    <style>
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.8);
            padding: 12px 20px;
            border-radius: 8px;
            margin: 4px 0;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            background: rgba(255,255,255,0.1);
            color: white;
        }
    </style>
</head>
<body>

<div class="container-fluid">
<div class="row">

<!-- SIDEBAR -->
<nav class="col-md-3 col-lg-2 d-md-block sidebar collapse show" id="sidebar">
<div class="position-sticky pt-3">

<div class="text-center mb-4">
<img src="../LOGO TMEKANIS.png" alt="Logo" style="height:50px;border-radius:10px;">
<h6 class="text-white mt-2">Admin Panel</h6>
</div>

<ul class="nav flex-column">

<li class="nav-item">
<a class="nav-link" href="dashboard.html">
<i class="bi bi-speedometer2 me-2"></i>Dashboard
</a>
</li>

<li class="nav-item">
<a class="nav-link" href="galeri.html">
<i class="bi bi-images me-2"></i>Kelola Galeri
</a>
</li>

<li class="nav-item">
<a class="nav-link active" href="kontak.html">
<i class="bi bi-person-contact me-2"></i>Kelola Kontak
</a>
</li>

<li class="nav-item">
<a class="nav-link" href="pengguna.html">
<i class="bi bi-people me-2"></i>Kelola Pengguna
</a>
</li>

<li class="nav-item">
<a class="nav-link" href="chat.html">
<i class="bi bi-chat me-2"></i>Chat
</a>
</li>


<li class="nav-item">
<a class="nav-link active" href="pengaturan-surat.html">
<i class="bi bi-gear me-2"></i>Pengaturan Surat
</a>
</li>

<li class="nav-item">
<a class="nav-link" href="cetak-surat.html">
<i class="bi bi-printer me-2"></i>Cetak Surat
</a>
</li>

<li class="nav-item">
<a class="nav-link" href="arsip-surat.html">
<i class="bi bi-archive me-2"></i>Arsip Surat
</a>
</li>

<li class="nav-item mt-3">
<a class="nav-link" href="#" onclick="logout()">
<i class="bi bi-box-arrow-right me-2"></i>Keluar
</a>
</li>

</ul>
</div>
</nav>

<!-- MAIN CONTENT -->
<main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">

<div class="d-flex justify-content-between align-items-center mb-4">
<h4 class="fw-bold" id="page-title">Kelola Kontak</h4>

<div class="d-flex align-items-center">
<span class="me-3">Admin: <strong id="admin-name"></strong></span>

<button class="btn btn-outline-danger btn-sm" onclick="logout()">
<i class="bi bi-box-arrow-right"></i> Keluar
</button>
</div>
</div>

<div id="alert-container"></div>

<!-- KONTAK CONTENT -->
<div class="card">

<div class="card-header">
<h5 class="mb-0">Informasi Kontak</h5>
</div>

<div class="card-body">

<form id="kontak-form">

<div class="row">

<div class="col-md-6 mb-3">
<label class="form-label">Alamat</label>
<textarea class="form-control" id="kontak-alamat" rows="3"></textarea>
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Nomor Telepon</label>
<input type="text" class="form-control" id="kontak-telepon">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">Email</label>
<input type="email" class="form-control" id="kontak-email">
</div>

<div class="col-md-6 mb-3">
<label class="form-label">WhatsApp</label>
<input type="text" class="form-control" id="kontak-whatsapp">
</div>

</div>

<button type="submit" class="btn btn-primary">
<i class="bi bi-save me-2"></i>Simpan Perubahan
</button>

</form>

</div>
</div>

</main>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin/admin.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const user = getCurrentUser();
    if (!user || user.role !== 'admin') {
        window.location.href = '../login.html';
        return;
    }
    document.getElementById('admin-name').textContent = user.username;
    loadKontak();
});
</script>

</body>
</html>
