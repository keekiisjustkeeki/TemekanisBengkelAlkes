<!-- MAIN CONTENT -->
<main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">

<div class="d-flex justify-content-between align-items-center mb-4">
<h4 class="fw-bold" id="page-title">Arsip Surat</h4>

<div class="d-flex align-items-center">
<span class="me-3">Admin: <strong id="admin-name"></strong></span>

<button class="btn btn-outline-danger btn-sm" onclick="logout()">
<i class="bi bi-box-arrow-right"></i> Keluar
</button>
</div>
</div>

<div id="alert-container"></div>

<!-- FILTER -->
<div class="card mb-3">
<div class="card-body">
<div class="row">
<div class="col-md-3">
<select class="form-select" id="filter-jenis" onchange="loadSurats()">
<option value="">Semua Jenis</option>
<option value="RAB">RAB</option>
<option value="INVOICE">Invoice</option>
</select>
</div>
<div class="col-md-3">
<select class="form-select" id="filter-status" onchange="loadSurats()">
<option value="">Semua Status</option>
<option value="draft">Draft</option>
<option value="dikirim">Dikirim</option>
<option value="diarsipkan">Diarsipkan</option>
</select>
</div>
<div class="col-md-3">
<input type="text" class="form-control" placeholder="Cari nomor/nama..." id="search-surat" onkeyup="loadSurats()">
</div>
</div>
</div>
</div>

<!-- TABLE -->
<div class="card">
<div class="card-body">
<div class="table-responsive">
<table class="table table-hover" id="surat-table">
<thead>
<tr>
<th>No</th>
<th>Nomor</th>
<th>Jenis</th>
<th>Pelanggan</th>
<th>Tanggal</th>
<th>Total</th>
<th>Status</th>
<th>Aksi</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>
</div>
</div>

</main>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/surat/surat.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const user = getCurrentUser();
    if (!user || user.role !== 'admin') {
        window.location.href = '../login.html';
        return;
    }
    document.getElementById('admin-name').textContent = user.username;
    loadSurats();
});

function loadSurats() {
    const surats = getAllSurats();
    const filterJenis = document.getElementById('filter-jenis').value;
    const filterStatus = document.getElementById('filter-status').value;
    const search = document.getElementById('search-surat').value.toLowerCase();
    
    let filtered = surats;
    
    if (filterJenis) {
        filtered = filtered.filter(s => s.jenis === filterJenis);
    }
    
    if (filterStatus) {
        filtered = filtered.filter(s => (s.status || 'draft') === filterStatus);
    }
    
    if (search) {
        filtered = filtered.filter(s => 
            s.nomor.toLowerCase().includes(search) || 
            s.nama_pelanggan.toLowerCase().includes(search)
        );
    }
    
    // Sort by date (newest first)
    filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    
    const tbody = document.querySelector('#surat-table tbody');
    
    if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center">Belum ada surat</td></tr>';
        return;
    }
    
    tbody.innerHTML = filtered.map((surat, index) => {
        const items = JSON.parse(surat.items || '[]');
        let total = 0;
        items.forEach(item => {
            total += item.jumlah * item.harga;
        });
        
        const tanggal = new Date(surat.created_at).toLocaleDateString('id-ID');
        const status = surat.status || 'draft';
        
        let statusBadge = '';
        if (status === 'draft') {
            statusBadge = '<span class="badge bg-secondary">Draft</span>';
        } else if (status === 'dikirim') {
            statusBadge = '<span class="badge bg-primary">Dikirim</span>';
        } else if (status === 'diarsipkan') {
            statusBadge = '<span class="badge bg-success">Diarsipkan</span>';
        }
        
        return `
            <tr>
                <td>${index + 1}</td>
                <td><strong>${surat.nomor}</strong></td>
                <td><span class="badge bg-${surat.jenis === 'RAB' ? 'warning' : 'primary'}">${surat.jenis}</span></td>
                <td>${surat.nama_pelanggan}</td>
                <td>${tanggal}</td>
                <td>${formatRupiah(total)}</td>
                <td>${statusBadge}</td>
                <td>
                    <button class="btn btn-sm btn-success" onclick="downloadSuratPDF('${surat.id}')" title="Download PDF">
                        <i class="bi bi-file-earmark-pdf"></i>
                    </button>
                    <button class="btn btn-sm btn-primary" onclick="printSurat('${surat.id}')" title="Cetak/Preview">
                        <i class="bi bi-printer"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteSuratConfirm('${surat.id}')" title="Hapus">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        `;
    }).join('');
}

function deleteSuratConfirm(id) {
    if (!confirm('Hapus surat ini dari arsip?')) return;
    deleteSurat(id);
    loadSurats();
    showAlert('Surat dihapus dari arsip!', 'success');
}

function showAlert(message, type) {
    document.getElementById('alert-container').innerHTML = 
        `<div class="alert alert-${type} alert-dismissible fade show">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>`;
    setTimeout(() => {
        document.getElementById('alert-container').innerHTML = '';
    }, 5000);
}

function logout() {
    localStorage.removeItem('currentUser');
    window.location.href = '../login.html';
}
</script>
